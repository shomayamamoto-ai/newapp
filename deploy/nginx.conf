# snsauto reverse proxy.
# Place at /etc/nginx/sites-available/snsauto and symlink into sites-enabled.
# Run certbot --nginx first; it fills in the TLS lines marked below.

server {
    listen 80;
    server_name snsauto.example.com;
    # certbot adds the redirect to 443 here.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name snsauto.example.com;

    # certbot fills these in:
    # ssl_certificate     /etc/letsencrypt/live/snsauto.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/snsauto.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Renders are large; the default 1M would reject every upload and download.
    client_max_body_size 512M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Without this the app would set cookies without the Secure flag,
        # because it cannot otherwise tell it is behind TLS.
        proxy_set_header X-Forwarded-Proto $scheme;

        # Rendering a video can take minutes; the 60s default would cut it off.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Videos fetched by Instagram's servers. Public by design - Meta carries no
    # session - and served straight from disk rather than through the app.
    location /public/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_buffering off;
        add_header Cache-Control "public, max-age=86400";
    }
}
